  "schemes": {
    "Today": {
      "build": {
        "targets": {
          "Today": "all"
        }
      },
      "run": {
        "config": "Debug"
      },
      "test": {
        "config": "Debug",
        "targets": [
          "TodayTests"
        ],
        "gatherCoverageData": false
      },
      "profile": {
        "config": "Release"
      },
      "archive": {
        "config": "Release"
      }
    },
    "TodayMock": {
      "build": {
        "targets": {
          "TodayMock": "all",
          "Today": "all"
        }
      },
      "run": {
        "config": "Debug"
      },
      "test": {
        "config": "Debug",
        "targets": [
          "TodayUITests"
        ],
        "gatherCoverageData": true
      }
    },
    "TodayTests": {
      "build": {
        "targets": {
          "TodayTestHost": "all",
          "TodayTests": [
            "test"
          ]
        }
      },
      "test": {
        "config": "Debug",
        "targets": [
          {
            "name": "TodayTests",
            "parallelizable": false
          }
        ],
        "gatherCoverageData": true,
        "commandLineArguments": {
          "-AppleLocale en_US_POSIX": true,
          "-AppleLanguages (en)": true
        },
        "environmentVariables": {
          "TZ": "UTC"
        }
      }
    },
    "TodaySnapshotTests": {
      "build": {
        "targets": {
          "TodayTestHost": "all",
          "TodaySnapshotTests": [
            "test"
          ]
        }
      },
      "test": {
        "config": "Debug",
        "targets": [
          {
            "name": "TodaySnapshotTests",
            "parallelizable": false
          }
        ],
        "gatherCoverageData": true,
        "commandLineArguments": {
          "-AppleLocale en_US_POSIX": true,
          "-AppleLanguages (en)": true
        },
        "environmentVariables": {
          "TZ": "UTC"
        }
      }
    },
    "TodayWorkbench": {
      "build": {
        "targets": {
          "TodayWorkbench": "all"
        }
      },
      "run": {
        "config": "Debug",
        "commandLineArguments": {
          "-scene clock.stopwatch": true
        },
        "environmentVariables": {
          "TZ": "UTC"
        }
      }
    },
    "TodayCI": {
      "build": {
        "targets": {
          "Today": "all",
          "TodayMock": "all",
          "TodayTests": [
            "test"
          ],
          "TodaySnapshotTests": [
            "test"
          ]
        }
      },
      "test": {
        "config": "Debug",
        "targets": [
          {
            "name": "TodayTests",
            "parallelizable": false
          },
          {
            "name": "TodaySnapshotTests",
            "parallelizable": false
          },
          {
            "name": "TodayUITests",
            "parallelizable": false
          }
        ],
        "gatherCoverageData": false,
        "commandLineArguments": {
          "-AppleLocale en_US_POSIX": true,
          "-AppleLanguages (en)": true
        },
        "environmentVariables": {
          "TZ": "UTC"
        }
      }
    }
  },
  "packages": {
    "TodayModules": {
      "path": "."
    },
    "SnapshotTesting": {
      "url": "https://github.com/pointfreeco/swift-snapshot-testing.git",
      "exactVersion": "1.19.6"
    }
  }
}
