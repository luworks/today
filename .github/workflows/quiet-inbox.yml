name: Quiet Inbox CI
on:
  pull_request:
    paths:
      - 'experiments/quiet-inbox/**'
      - '.github/workflows/quiet-inbox.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/quiet-inbox/**'
      - '.github/workflows/quiet-inbox.yml'
permissions:
  contents: read
concurrency:
  group: quiet-inbox-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quiet-inbox:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Classifier regressions
        run: swift test --package-path experiments/quiet-inbox/Core
      - run: ./dev bootstrap --tool xcodegen
      - name: Generate standalone project
        run: .dev-tools/xcodegen/2.46.0/bin/xcodegen generate --spec experiments/quiet-inbox/project.yml
      - name: Build app and actual IdentityLookup extension
        run: >-
          xcodebuild -project experiments/quiet-inbox/QuietInbox.xcodeproj
          -scheme QuietInbox -sdk iphonesimulator -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/quiet-inbox-dd"
          CODE_SIGNING_ALLOWED=NO build
