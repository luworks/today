name: Today CI
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  # Manual only: the simulator-hosted non-UI suites (`full`). CI runs no UI tests.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: today-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
jobs:
  checks:
    if: github.event_name != 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Docs/prototype-only pull requests: the job stays and reports green, its steps skip.
      - id: scope
        if: github.event_name == 'pull_request'
        run: python3 scripts/ci/scope.py
        env:
          GH_TOKEN: ${{ github.token }}
          RANGE: ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
      - if: steps.scope.outputs.app != 'false'
        run: python3 scripts/ci/job.py --command ./dev bootstrap --tool swift-format --tool swiftlint --tool ruff --tool actionlint
      - if: steps.scope.outputs.app != 'false'
        run: python3 scripts/ci/job.py --command ./dev format --check
      - if: steps.scope.outputs.app != 'false'
        run: python3 scripts/ci/job.py --command ./dev lint
      - if: steps.scope.outputs.app != 'false'
        run: python3 scripts/ci/job.py --command ./dev test helpers
      - if: steps.scope.outputs.app != 'false'
        run: python3 scripts/ci/job.py --command ./dev test qa
      - if: steps.scope.outputs.app != 'false'
        run: python3 scripts/ci/job.py --command ./dev test unit
      # Export allowlisted diagnostics only; raw command bytes remain runner-local/private.
      - if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checks-failure-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/today-ci/failure
          if-no-files-found: warn
          retention-days: 7
  # Merge gate: build the app, widget and share extension plus test bundles. No simulator.
  today-required:
    if: github.event_name != 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write # deletes this job's own older dd-v1- caches on push to main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Docs/prototype-only pull requests: the job stays and reports green, its steps skip.
      - id: scope
        if: github.event_name == 'pull_request'
        run: python3 scripts/ci/scope.py
        env:
          GH_TOKEN: ${{ github.token }}
          RANGE: ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
      # Pull requests build incrementally on the DerivedData of the newest green main. Everything
      # else builds clean, so anything a warm cache could mask is caught on main.
      - id: dd
        if: steps.scope.outputs.app != 'false'
        run: echo "prefix=dd-v1-$ImageVersion-${{ hashFiles('ios/project.yml', 'ios/Config/**', 'ios/Package.swift', 'ios/Dependencies/Package.resolved') }}-" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'pull_request' && steps.scope.outputs.app != 'false'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/today-ci/dd
          key: ${{ steps.dd.outputs.prefix }}${{ github.sha }}
          restore-keys: ${{ steps.dd.outputs.prefix }}
      - if: github.event_name != 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/today-ci/dd/SourcePackages
          key: spm-${{ hashFiles('ios/Dependencies/Package.resolved') }}
      - if: steps.scope.outputs.app != 'false'
        run: python3 scripts/ci/job.py --build
      - if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/today-ci/dd
          key: ${{ steps.dd.outputs.prefix }}${{ github.sha }}
      # One DerivedData is about 500 MB and the repository's cache limit is 10 GB: keep the newest two.
      - if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache list -R "$GITHUB_REPOSITORY" --key dd-v1- --sort created_at --order desc --limit 100 --json id -q '.[2:][].id' | xargs -n1 gh cache delete -R "$GITHUB_REPOSITORY"
      # TodayMock simulator build (arm64) for agents without Xcode; launch with -uiTesting -dataset <path>.
      # Simulator only: never on a phone, never next to One.app in the same simulator.
      - if: github.event_name != 'pull_request'
        run: ditto -c -k --keepParent "$RUNNER_TEMP/today-ci/dd/Build/Products/Debug-iphonesimulator/TodayMock.app" "$RUNNER_TEMP/TodayMock.app.zip"
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TodayMock-sim-${{ github.sha }}
          path: ${{ runner.temp }}/TodayMock.app.zip
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 7
      # Export allowlisted diagnostics only; raw command bytes remain runner-local/private.
      - if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-failure-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/today-ci/failure
          if-no-files-found: warn
          retention-days: 7
  full:
    if: github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./dev bootstrap --tool xcodegen
      - run: ./dev test unit --timeout 1800
      - run: ./dev test ios-unit --timeout 1800
      - run: ./dev test integration --timeout 1800
      - run: ./dev test snapshot --timeout 1800
